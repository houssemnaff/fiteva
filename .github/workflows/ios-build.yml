name: Build iOS IPA

on:
  push:
    branches: [main]

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLUTTER_XCODE_CODE_SIGN_IDENTITY="" \
            --dart-define=FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO \
            --dart-define=FLUTTER_XCODE_CODE_SIGN_ENTITLEMENTS="" \
            --dart-define=FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app.ipa