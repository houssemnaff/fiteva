workflows:
ios-unsigned:
name: Build iOS IPA (unsigned)
max_build_duration: 60


environment:
  flutter: stable
  xcode: latest

scripts:
  - name: Flutter pub get
    script: |
      flutter pub get

  - name: Build Flutter iOS (no codesign)
    script: |
      flutter build ios --release --no-codesign

  - name: Create unsigned IPA
    script: |
      set -e

      APP_PATH="build/ios/iphoneos/Runner.app"

      echo "=== Checking Runner.app ==="
      if [ ! -d "$APP_PATH" ]; then
        echo "ERROR: Runner.app was not found at $APP_PATH"
        exit 1
      fi

      ls -la "$APP_PATH"

      echo "=== Checking Info.plist ==="
      if [ ! -f "$APP_PATH/Info.plist" ]; then
        echo "ERROR: Info.plist was not found"
        exit 1
      fi

      plutil -lint "$APP_PATH/Info.plist"
      plutil -p "$APP_PATH/Info.plist"

      echo "=== Creating Payload directory ==="
      rm -rf Payload
      mkdir -p Payload

      echo "=== Copying Runner.app ==="
      cp -R "$APP_PATH" Payload/Runner.app

      echo "=== Creating IPA ==="
      rm -f app.ipa
      /usr/bin/zip -r -q app.ipa Payload

      echo "=== IPA created successfully ==="
      ls -lh app.ipa

artifacts:
  - app.ipa

